name: Transcribir audio
on:
  push:
    paths:
      - 'BackAlign/sistema/transcribir/*.mp3'
      - 'BackAlign/sistema/scripts/transcribir.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transcribir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Whisper
        run: pip install faster-whisper 2>&1 | tail -5
      - name: Transcribir pendientes
        continue-on-error: true
        run: |
          set -o pipefail
          python BackAlign/sistema/scripts/transcribir.py 2>&1 | tail -40 > BackAlign/sistema/transcribir/ultimo_log.txt
      - name: Guardar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add BackAlign/sistema/transcribir
          git diff --cached --quiet || git commit -m "Transcripciones"
          git pull --rebase
          git push
