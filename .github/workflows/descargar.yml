name: Descargar resultados
on:
  push:
    paths:
      - 'pedidos/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar URLs pendientes
        run: |
          mkdir -p resultados
          for f in pedidos/*.txt; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .txt)
            url=$(head -n1 "$f" | tr -d '\r')
            if [ ! -f "resultados/$name.mp4" ]; then
              curl -fsSL --retry 3 -o "resultados/$name.mp4" "$url" || echo "fallo $name"
            fi
          done
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add resultados
          git diff --cached --quiet || git commit -m "Resultados descargados"
          git push
